<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name = "theme-color" content = "#071a3d"/>
    <title>A Little Birthday Surprise:P</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;700;800;900&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background" aria-hidden="true">
        <div class="moon"></div>
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div id="stars"></div>
    </div>

    <div id="confetti-layer" aria-hidden="true"></div>
    <div id="sparkle-layer" aria-hidden="true"></div>


    <main>
        <section id="intro-screen" class="screen screen-active">
            <div class="intro-card glass-card">
                <div class="tiny-badge">a tiny surprise made just for you:3</div>

                <div class="gift-icon" aria-hidden="true">
                    <span class="gift-bow">♡</span>
                    <span class="gift-box">🎁</span>
                </div>

                <p class="eyebrow">birthday mission #01</p>

                <h1>
                    Hey <span class="accent-text">Zoyaaa</span>,
                    <br>
                    Are you READY?
                </h1>

                <p class="intro-subtitle">
                    Warning: pressing the wrong button may result in 
                    <span class="highlight">EXTREME BIRTHDAY CONSEQUENCES.</span>
                </p>

                <div class="button-stage" id="button-stage">
                    <button id="yes-btn" class="btn btn-yes">
                        <span>YESSS 💙</span>
                    </button>
                </div>

                <div class="message-box" aria-live="polite">
                    <span class="message-icon">💭</span>
                    <p id="no-message">Hmmm... Choose wisely...</p>
                </div>

                <p class="tiny-note"></p>

            </div>

            <div class="scroll-decoration" aria-hidden="true">
                <span>✦</span>
                <span>♡</span>
                <span>✦</span>
            </div>
        </section>

        



    </main>


</body>
</html>
